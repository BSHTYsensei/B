name: iOS App UI and Feature Reverse Analysis

on:
  push:
    paths:
      - '*.ipa'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-ui-reverse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reverse-analysis:
    name: Analyze UI structure and app implementation
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      WORK_DIR: ${{ github.workspace }}/.ipa-reverse-work
      FULL_DISASSEMBLY: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Install reverse-engineering tools
        shell: bash
        run: |
          set -euo pipefail
          brew install blacktop/tap/ipsw radare2
          {
            echo "PYTHON=$(command -v python3)"
            echo "PATH=$(brew --prefix)/bin:$PATH"
          } >> "$GITHUB_ENV"
          {
            echo '### Tool versions'
            ipsw version 2>&1 | head -n 2 || true
            r2 -v 2>&1 | head -n 1 || true
            python3 --version
            xcrun --find ibtool 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find root IPA and extract the main app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/extracted" "$WORK_DIR/analysis"

          # IPA 必须放在仓库根目录。app.ipa 优先；否则只接受唯一的 .ipa。
          if [[ -f "$GITHUB_WORKSPACE/app.ipa" ]]; then
            ipa_file="$GITHUB_WORKSPACE/app.ipa"
          else
            ipa_files=()
            while IFS= read -r ipa_path; do
              ipa_files+=("$ipa_path")
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.ipa' -print | sort)

            if [[ "${#ipa_files[@]}" -eq 0 ]]; then
              echo '::error::仓库根目录没有找到 IPA 文件。请直接把一个 .ipa 上传到仓库根目录。'
              exit 1
            elif [[ "${#ipa_files[@]}" -gt 1 ]]; then
              echo '::error::根目录发现多个 IPA。请只保留一个，或将目标文件命名为 app.ipa。'
              printf '%s\n' "${ipa_files[@]}"
              exit 1
            fi
            ipa_file="${ipa_files[0]}"
          fi

          echo "Selected IPA: $(basename "$ipa_file")"

          # ZIP 安全解压：拒绝绝对路径和 .. 路径穿越。
          "$PYTHON" - "$ipa_file" "$WORK_DIR/extracted" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2]).resolve()
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  rel = pathlib.PurePosixPath(item.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      print(f'Skipped unsafe archive entry: {item.filename}')
                      continue
                  target = (root / pathlib.Path(*rel.parts)).resolve()
                  if target != root and root not in target.parents:
                      print(f'Skipped out-of-root entry: {item.filename}')
                      continue
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(item) as src, target.open('wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          PY

          payload="$WORK_DIR/extracted/Payload"
          [[ -d "$payload" ]] || { echo '::error::IPA 中没有 Payload 目录。'; exit 1; }

          app_candidates=()
          while IFS= read -r app_path; do
            app_candidates+=("$app_path")
          done < <(find "$payload" -maxdepth 1 -type d -name '*.app' -print | sort)

          if [[ "${#app_candidates[@]}" -ne 1 ]]; then
            echo '::error::Payload 顶层必须恰好有一个 .app；无法唯一确定主 App。'
            printf '%s\n' "${app_candidates[@]}"
            exit 1
          fi

          app_dir="${app_candidates[0]}"
          info_plist="$app_dir/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist" 2>/dev/null || true)"
          [[ -n "$executable" && -f "$app_dir/$executable" ]] || {
            echo '::error::无法通过 Info.plist 的 CFBundleExecutable 找到主程序。'
            exit 1
          }
          main_binary="$app_dir/$executable"
          file "$main_binary" | grep -q 'Mach-O' || {
            echo '::error::CFBundleExecutable 不是可识别的 Mach-O 文件。'
            file "$main_binary" || true
            exit 1
          }

          {
            echo "APP_DIR=$app_dir"
            echo "MAIN_BINARY=$main_binary"
            echo "ANALYSIS_DIR=$WORK_DIR/analysis"
          } >> "$GITHUB_ENV"

          {
            echo '### IPA identified'
            echo "- IPA: $(basename "$ipa_file")"
            echo "- App: $(basename "$app_dir")"
            echo "- Executable: $executable"
            echo "- Binary: $(file -b "$main_binary")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract UI-related bundle metadata and localized text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANALYSIS_DIR/metadata" "$ANALYSIS_DIR/ui_analysis/localized_text"

          "$PYTHON" - "$APP_DIR" "$ANALYSIS_DIR/metadata" "$ANALYSIS_DIR/ui_analysis" <<'PY'
          import json, pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          meta_out = pathlib.Path(sys.argv[2])
          ui_out = pathlib.Path(sys.argv[3])
          meta_out.mkdir(parents=True, exist_ok=True)
          localized_out = ui_out / 'localized_text'
          localized_out.mkdir(parents=True, exist_ok=True)

          def load_plist(path):
              try:
                  with path.open('rb') as f:
                      return plistlib.load(f)
              except Exception:
                  return {}

          bundle_rows = []
          for info in sorted(app.rglob('Info.plist')):
              data = load_plist(info)
              if not data:
                  continue
              rel = str(info.parent.relative_to(app))
              ui_keys = (
                  'UIMainStoryboardFile', 'NSMainNibFile', 'UILaunchStoryboardName',
                  'UIApplicationSceneManifest', 'UIUserInterfaceStyle',
                  'UISupportedInterfaceOrientations', 'UISupportedInterfaceOrientations~ipad',
                  'UIRequiresFullScreen', 'UIUserInterfaceIdiom', 'UIDeviceFamily',
              )
              permission_keys = {
                  k: v for k, v in data.items()
                  if 'UsageDescription' in k or k.endswith('Tracking')
              }
              bundle_rows.append({
                  'path': rel,
                  'bundle_id': data.get('CFBundleIdentifier'),
                  'bundle_name': data.get('CFBundleDisplayName') or data.get('CFBundleName'),
                  'executable': data.get('CFBundleExecutable'),
                  'version': data.get('CFBundleShortVersionString'),
                  'build': data.get('CFBundleVersion'),
                  'minimum_os': data.get('MinimumOSVersion'),
                  'ui_entry_configuration': {k: data[k] for k in ui_keys if k in data},
                  'permission_usage_descriptions': permission_keys,
              })

          main_info = load_plist(app / 'Info.plist')
          result = {
              'main_app': app.name,
              'bundle_count': len(bundle_rows),
              'bundles': bundle_rows,
              'main_ui_entry_configuration': {
                  k: main_info[k] for k in (
                      'UIMainStoryboardFile', 'NSMainNibFile', 'UILaunchStoryboardName',
                      'UIApplicationSceneManifest', 'UIUserInterfaceStyle',
                      'UISupportedInterfaceOrientations', 'UISupportedInterfaceOrientations~ipad',
                  ) if k in main_info
              },
          }
          (meta_out / 'bundle_metadata.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, default=str), encoding='utf-8')

          # strings / stringsdict：兼容二进制 plist 和文本 OpenStep plist 格式。
          import subprocess
          localized = []
          for src in sorted(app.rglob('*')):
              if not src.is_file() or src.suffix.lower() not in {'.strings', '.stringsdict'}:
                  continue
              rel = src.relative_to(app)
              safe = str(rel).replace('/', '__')
              target = localized_out / (safe + '.json')
              proc = subprocess.run(
                  ['plutil', '-convert', 'json', '-o', '-', str(src)],
                  capture_output=True, text=True
              )
              if proc.returncode == 0:
                  try:
                      parsed = json.loads(proc.stdout)
                      target.write_text(json.dumps(parsed, ensure_ascii=False, indent=2), encoding='utf-8')
                      localized.append({'path': str(rel), 'json': str(target.relative_to(ui_out)), 'entries': len(parsed) if isinstance(parsed, dict) else None})
                      continue
                  except Exception:
                      pass
              localized.append({'path': str(rel), 'json': None, 'entries': None, 'note': 'plutil could not parse this file'})

          (ui_out / 'localized_text_index.json').write_text(
              json.dumps(localized, ensure_ascii=False, indent=2), encoding='utf-8')

          md = ['# Bundle / UI Entry Metadata', '', f'- Main app: `{app.name}`', f'- Bundle count: {len(bundle_rows)}', '']
          for b in bundle_rows:
              md += [f"## {b['path']}", f"- Bundle ID: `{b.get('bundle_id')}`",
                     f"- Executable: `{b.get('executable')}`",
                     f"- Version / Build: `{b.get('version')}` / `{b.get('build')}`",
                     f"- Minimum OS: `{b.get('minimum_os')}`",
                     f"- UI entry configuration: `{json.dumps(b.get('ui_entry_configuration', {}), ensure_ascii=False)}`"]
              for k, v in b.get('permission_usage_descriptions', {}).items():
                  md.append(f'- Permission prompt `{k}`: {v}')
              md.append('')
          (meta_out / 'bundle_metadata.md').write_text('\n'.join(md), encoding='utf-8')
          PY

      - name: Inventory compiled Storyboards, NIBs and UI definition files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANALYSIS_DIR/ui_analysis/interface_builder"

          "$PYTHON" - "$APP_DIR" "$ANALYSIS_DIR/ui_analysis" <<'PY'
          import csv, pathlib, sys
          app = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          valid_suffixes = {'.nib', '.storyboard', '.xib', '.strings', '.stringsdict'}
          rows = []
          for p in sorted(app.rglob('*')):
              if p.is_file() and p.suffix.lower() in valid_suffixes:
                  rows.append({'path': str(p.relative_to(app)), 'kind': p.suffix.lower(), 'size': p.stat().st_size})
              elif p.is_dir() and p.suffix.lower() == '.storyboardc':
                  rows.append({'path': str(p.relative_to(app)), 'kind': '.storyboardc directory', 'size': ''})
          with (out / 'ui_files_manifest.csv').open('w', newline='', encoding='utf-8-sig') as f:
              writer = csv.DictWriter(f, fieldnames=['path', 'kind', 'size'])
              writer.writeheader()
              writer.writerows(rows)
          print(f'UI definition files/directories found: {len(rows)}')
          PY

          # ibtool 对编译后的 NIB 尝试导出对象层级；失败只记录，不阻断其它分析。
          nib_index=0
          while IFS= read -r -d '' nib; do
            nib_index=$((nib_index + 1))
            relative="${nib#"$APP_DIR"/}"
            safe_name="$(printf '%s' "$relative" | sed 's#[^A-Za-z0-9._-]#_#g')"
            ibtool --objects --output-format human-readable-text "$nib" \
              > "$ANALYSIS_DIR/ui_analysis/interface_builder/${nib_index}_${safe_name}.txt" \
              2> "$ANALYSIS_DIR/ui_analysis/interface_builder/${nib_index}_${safe_name}.stderr.txt" || true
          done < <(find "$APP_DIR" -type f -name '*.nib' -print0)

          # 将 Info.plist 中声明的主 Storyboard / Scene 配置单独列出，便于定位启动入口。
          "$PYTHON" - "$ANALYSIS_DIR/metadata/bundle_metadata.json" "$ANALYSIS_DIR/ui_analysis/ui_entry_points.md" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          lines = ['# UI Entry Points', '']
          for bundle in data.get('bundles', []):
              cfg = bundle.get('ui_entry_configuration', {})
              lines += [f"## {bundle.get('path')}"]
              if cfg:
                  for key, value in cfg.items():
                      lines.append(f'- `{key}`: `{json.dumps(value, ensure_ascii=False)}`')
              else:
                  lines.append('- No explicit storyboard / nib / scene entry key found in this Info.plist.')
              lines.append('')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Analyze Mach-O classes, methods, Swift types and functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANALYSIS_DIR/macho" "$ANALYSIS_DIR/objc" "$ANALYSIS_DIR/swift"
          binary_count=0

          while IFS= read -r -d '' binary; do
            description="$(file -b "$binary" 2>/dev/null || true)"
            [[ "$description" == *Mach-O* ]] || continue
            binary_count=$((binary_count + 1))
            relative="${binary#"$APP_DIR"/}"
            safe_name="$(printf '%s' "$relative" | sed 's#[^A-Za-z0-9._-]#_#g')"
            out="$ANALYSIS_DIR/macho/$safe_name"
            objc_dir="$ANALYSIS_DIR/objc/${safe_name}"
            swift_dir="$ANALYSIS_DIR/swift/${safe_name}"
            mkdir -p "$out" "$objc_dir/headers" "$swift_dir/headers"

            {
              echo "Path: $relative"
              echo "File: $description"
              echo "Size: $(du -h "$binary" | awk '{print $1}')"
              echo "SHA256: $(shasum -a 256 "$binary" | awk '{print $1}')"
              echo "Architectures: $(lipo -archs "$binary" 2>/dev/null || echo unknown)"
              echo
              rabin2 -I "$binary" 2>&1 || true
            } > "$out/binary_info.txt"

            rabin2 -E "$binary" > "$out/exports.txt" 2>&1 || true
            rabin2 -i "$binary" > "$out/imports.txt" 2>&1 || true
            rabin2 -s "$binary" > "$out/symbols.txt" 2>&1 || true

            archs="$(lipo -archs "$binary" 2>/dev/null || true)"
            [[ -n "$archs" ]] || archs='arm64'
            for arch in $archs; do
              safe_arch="$(printf '%s' "$arch" | tr -cd 'A-Za-z0-9_-')"
              otool -arch "$arch" -hv "$binary" > "$out/header_${safe_arch}.txt" 2>&1 || true
              otool -arch "$arch" -l "$binary" > "$out/load_commands_${safe_arch}.txt" 2>&1 || true
              nm -arch "$arch" -m "$binary" > "$out/nm_${safe_arch}.txt" 2>&1 || true
              ipsw macho info "$binary" --arch "$arch" --header --loads --json \
                > "$out/macho_info_${safe_arch}.json" 2> "$out/macho_info_${safe_arch}.stderr.txt" || true
              ipsw macho info "$binary" --arch "$arch" --objc \
                > "$out/objc_metadata_${safe_arch}.txt" 2> "$out/objc_metadata_${safe_arch}.stderr.txt" || true
              ipsw macho info "$binary" --arch "$arch" --objc-refs \
                > "$out/objc_references_${safe_arch}.txt" 2> "$out/objc_references_${safe_arch}.stderr.txt" || true
              ipsw macho info "$binary" --arch "$arch" --symbols \
                > "$out/ipsw_symbols_${safe_arch}.txt" 2> "$out/ipsw_symbols_${safe_arch}.stderr.txt" || true
              ipsw macho info "$binary" --arch "$arch" --starts \
                > "$out/function_starts_${safe_arch}.txt" 2> "$out/function_starts_${safe_arch}.stderr.txt" || true

              ipsw class-dump "$binary" --arch "$arch" --headers --output "$objc_dir/headers_${safe_arch}" \
                > "$objc_dir/class_dump_${safe_arch}.txt" 2>&1 || true
              ipsw swift-dump "$binary" --arch "$arch" --demangle --extra --headers --output "$swift_dir/headers_${safe_arch}" \
                > "$swift_dir/swift_dump_${safe_arch}.txt" 2>&1 || true

              r2 -q -A -c 'iI; afl; axt' "$binary" \
                > "$out/radare2_${safe_arch}.txt" 2>&1 || true

              # ipsw macho disass 支持 ARM64；其它架构保留符号/元数据，不尝试错误反汇编。
              if [[ "$FULL_DISASSEMBLY" == 'true' && ( "$arch" == 'arm64' || "$arch" == 'arm64e' ) ]]; then
                if ! ipsw macho disass "$binary" --arch "$arch" --section __TEXT_EXEC.__text --json --quiet \
                    > "$out/disassembly_${safe_arch}.json" 2> "$out/disassembly_${safe_arch}.stderr.txt"; then
                  ipsw macho disass "$binary" --arch "$arch" --section __TEXT.__text --json --quiet \
                    > "$out/disassembly_${safe_arch}.json" 2> "$out/disassembly_${safe_arch}.fallback.stderr.txt" || true
                fi
                if [[ ! -s "$out/disassembly_${safe_arch}.json" ]]; then
                  echo 'No disassembly produced. The slice may be encrypted, unsupported, or use a different text section.' \
                    > "$out/disassembly_${safe_arch}.status.txt"
                fi
              fi
            done
          done < <(find "$APP_DIR" -type f -print0)

          if [[ "$binary_count" -eq 0 ]]; then
            echo '::error::在 .app 内没有发现 Mach-O 文件。'
            exit 1
          fi
          echo "MACHO_BINARY_COUNT=$binary_count" >> "$GITHUB_ENV"
          echo "Mach-O files analyzed: $binary_count"

      - name: Build UI page, control and feature candidates
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - "$APP_DIR" "$ANALYSIS_DIR" <<'PY'
          import csv, json, pathlib, re, sys
          app, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          objc_root, swift_root, macho_root = root / 'objc', root / 'swift', root / 'macho'

          screen_re = re.compile(r'(ViewController|ViewModel|Coordinator|Router|Screen|Page|Tab|Cell|ReusableView|Header|Footer|Popup|Modal|Sheet|Dialog|View)$', re.I)
          framework_re = re.compile(r'UIKit|SwiftUI|UIHostingController|UIViewController|UIView|NSView|ReactNative|Flutter|WKWebView|AsyncDisplayKit|Texture|SnapKit|Masonry')
          action_re = re.compile(r'(IBAction|didSelect|shouldSelect|onTap|tap|Tapped|Pressed|Clicked|submit|confirm|cancel|save|delete|open|close|dismiss|present|push|navigate|viewDidLoad|viewWillAppear|viewDidAppear)', re.I)
          nav_re = re.compile(r'(pushViewController|presentViewController|performSegueWithIdentifier|showViewController|setViewControllers|dismissViewController|NavigationStack|NavigationLink|navigationDestination|TabView|UIHostingController)', re.I)
          known_system_prefixes = ('UI', 'NS', 'Swift', 'CA', 'MK', 'WK', 'SK', 'AV', 'CF', 'CT', 'CG')

          class_rows, action_rows, nav_rows, framework_hits = [], [], [], []
          text_files = list(objc_root.rglob('*.txt')) + list(objc_root.rglob('*.h')) + list(swift_root.rglob('*.txt')) + list(swift_root.rglob('*.swift')) + list(macho_root.rglob('*.txt'))
          seen_classes = set()
          seen_actions = set()
          seen_nav = set()

          for path in text_files:
              try:
                  content = path.read_text(errors='ignore')
              except OSError:
                  continue
              rel = str(path.relative_to(root))
              for match in framework_re.finditer(content):
                  value = match.group(0)
                  if value not in framework_hits:
                      framework_hits.append(value)

              # Objective-C class / protocol declarations from generated headers and metadata.
              for match in re.finditer(r'@interface\s+([A-Za-z_$][\w$]*)\s*(?::\s*([A-Za-z_$][\w$]*))?', content):
                  name, parent = match.group(1), match.group(2) or ''
                  key = (name, rel)
                  if key not in seen_classes:
                      seen_classes.add(key)
                      likely_screen = bool(screen_re.search(name)) and not name.startswith(known_system_prefixes)
                      class_rows.append({'name': name, 'parent': parent, 'candidate_type': 'page_or_component_candidate' if likely_screen else 'class', 'evidence_file': rel, 'confidence': 'name-based candidate' if likely_screen else 'class metadata'})

              # Swift type declarations; retain names and evidence file only.
              for match in re.finditer(r'\b(?:class|struct|enum|protocol)\s+([A-Za-z_$][\w$]*)', content):
                  name = match.group(1)
                  key = (name, rel)
                  if key not in seen_classes:
                      seen_classes.add(key)
                      likely_screen = bool(screen_re.search(name)) and not name.startswith(known_system_prefixes)
                      class_rows.append({'name': name, 'parent': '', 'candidate_type': 'page_or_component_candidate' if likely_screen else 'swift_type', 'evidence_file': rel, 'confidence': 'name-based candidate' if likely_screen else 'type metadata'})

              # Action-like method/selector evidence. No claim that the method is reachable.
              for line in content.splitlines():
                  stripped = line.strip()
                  if not stripped or not action_re.search(stripped):
                      continue
                  if len(stripped) > 500:
                      continue
                  key = (rel, stripped)
                  if key not in seen_actions:
                      seen_actions.add(key)
                      action_rows.append({'evidence_file': rel, 'method_or_symbol_candidate': stripped, 'confidence': 'static method-name clue'})

              for line in content.splitlines():
                  if not nav_re.search(line):
                      continue
                  stripped = line.strip()
                  if len(stripped) > 500:
                      continue
                  key = (rel, stripped)
                  if key not in seen_nav:
                      seen_nav.add(key)
                      nav_rows.append({'evidence_file': rel, 'navigation_api_candidate': stripped, 'confidence': 'static navigation clue'})

          def write_csv(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8-sig') as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)

          write_csv(root / 'feature_map.csv', class_rows + [
              {'name': r['method_or_symbol_candidate'], 'parent': '', 'candidate_type': 'interaction_method_candidate', 'evidence_file': r['evidence_file'], 'confidence': r['confidence']}
              for r in action_rows
          ], ['name', 'parent', 'candidate_type', 'evidence_file', 'confidence'])
          write_csv(root / 'ui_analysis' / 'navigation_candidates.csv', nav_rows, ['evidence_file', 'navigation_api_candidate', 'confidence'])
          write_csv(root / 'ui_analysis' / 'interaction_candidates.csv', action_rows, ['evidence_file', 'method_or_symbol_candidate', 'confidence'])

          ui_manifest = root / 'ui_analysis' / 'ui_files_manifest.csv'
          try:
              with ui_manifest.open(encoding='utf-8-sig', newline='') as f:
                  ui_files = list(csv.DictReader(f))
          except Exception:
              ui_files = []

          summary = {
              'ui_definition_file_count': len(ui_files),
              'objc_or_swift_type_candidates': len(class_rows),
              'interaction_method_candidates': len(action_rows),
              'navigation_api_candidates': len(nav_rows),
              'ui_framework_indicators': sorted(framework_hits),
              'notes': [
                  'All candidates are static clues, not confirmed runtime screens or verified behavior.',
                  'Actual page order, conditional flows, button outcomes and dynamically built views require runtime interaction capture.'
              ]
          }
          (root / 'ui_analysis' / 'ui_static_map.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          md = ['# Static UI / Feature Map', '',
                '> 下列页面、控件和导航均为静态候选线索；不能仅凭类名确认真实页面，也不能证明某按钮在运行时可达。', '',
                '## Summary',
                f"- UI definition files/directories: {len(ui_files)}",
                f"- Class/type candidates: {len(class_rows)}",
                f"- Interaction method candidates: {len(action_rows)}",
                f"- Navigation API candidates: {len(nav_rows)}",
                f"- UI framework indicators: {', '.join(sorted(framework_hits)) or 'No clear marker found'}", '',
                '## Page / component candidates', '']
          candidates = [r for r in class_rows if r['candidate_type'] == 'page_or_component_candidate']
          if candidates:
              md += [f"- `{r['name']}` (evidence: `{r['evidence_file']}`; {r['confidence']})" for r in candidates[:500]]
          else:
              md.append('- No clear page/component name found. Check Swift metadata, symbols and runtime capture.')
          md += ['', '## Interaction method candidates', '']
          md += [f"- `{r['method_or_symbol_candidate']}` — `{r['evidence_file']}`" for r in action_rows[:300]] or ['- No obvious action-like method names found.']
          md += ['', '## Navigation API candidates', '']
          md += [f"- `{r['navigation_api_candidate']}` — `{r['evidence_file']}`" for r in nav_rows[:200]] or ['- No obvious navigation API references found.']
          md += ['', '## Interpretation',
                 '- `feature_map.csv` 汇总类型、页面/组件候选和交互方法名线索。',
                 '- `navigation_candidates.csv` 汇总导航 API 的静态出现位置。',
                 '- 要确认每个按钮的真实行为，需要动态操作 App 并观察状态变化、调用栈和页面层级。', '']
          (root / 'ui_analysis' / 'ui_static_map.md').write_text('\n'.join(md), encoding='utf-8')
          PY

      - name: Generate runtime UI inspector and capture instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANALYSIS_DIR/runtime_ui"
          cat > "$ANALYSIS_DIR/runtime_ui/frida_ui_inspector.js" <<'JS'
          // Runtime UI inspector for an app/device you own or are authorized to test.
          // Run with Frida attached to the app process. It logs visible view hierarchy,
          // view-controller appearances, UIControl actions, and navigation transitions.
          'use strict';

          if (!ObjC.available) {
            console.log('[!] Objective-C runtime is unavailable in this process.');
          } else {
            function safeString(value) {
              try {
                if (value === null || value === undefined) return '';
                return value.toString();
              } catch (_) { return ''; }
            }

            function valueOf(obj, selector) {
              try {
                if (!obj || obj.isNull()) return '';
                var result = obj[selector]();
                return safeString(result);
              } catch (_) { return ''; }
            }

            function rectOf(view) {
              try {
                var r = view.frame();
                return {
                  x: Number(r.origin.x), y: Number(r.origin.y),
                  width: Number(r.size.width), height: Number(r.size.height)
                };
              } catch (_) { return null; }
            }

            function viewNode(view, depth) {
              if (depth > 24) return null;
              var node = {
                class: view.$className || 'UnknownView',
                frame: rectOf(view),
                hidden: false,
                alpha: null,
                accessibilityIdentifier: valueOf(view, 'accessibilityIdentifier'),
                accessibilityLabel: valueOf(view, 'accessibilityLabel'),
                text: '',
                children: []
              };
              try { node.hidden = !!view.isHidden(); } catch (_) {}
              try { node.alpha = Number(view.alpha()); } catch (_) {}

              var cls = node.class;
              try {
                if (cls.indexOf('UILabel') !== -1 || cls.indexOf('UITextField') !== -1 || cls.indexOf('UITextView') !== -1) {
                  node.text = valueOf(view, 'text');
                } else if (cls.indexOf('UIButton') !== -1) {
                  node.text = valueOf(view, 'currentTitle');
                }
              } catch (_) {}

              try {
                var subviews = view.subviews();
                var count = Math.min(Number(subviews.count()), 500);
                for (var i = 0; i < count; i++) {
                  var child = subviews.objectAtIndex_(i);
                  var childNode = viewNode(child, depth + 1);
                  if (childNode) node.children.push(childNode);
                }
              } catch (_) {}
              return node;
            }

            function dumpWindows(reason) {
              try {
                var app = ObjC.classes.UIApplication.sharedApplication();
                var windows = app.windows();
                var count = Math.min(Number(windows.count()), 30);
                for (var i = 0; i < count; i++) {
                  var window = windows.objectAtIndex_(i);
                  var rootVC = null;
                  try { rootVC = window.rootViewController(); } catch (_) {}
                  var controllerName = rootVC ? rootVC.$className : '';
                  var rootView = null;
                  try { rootView = rootVC ? rootVC.view() : window; } catch (_) { rootView = window; }
                  var payload = {
                    type: 'ui_hierarchy', reason: reason, windowIndex: i,
                    rootViewController: controllerName,
                    hierarchy: viewNode(rootView, 0)
                  };
                  send(payload);
                }
              } catch (e) {
                console.log('[!] UI hierarchy collection failed: ' + e);
              }
            }

            function hookMethod(className, selector, callbacks) {
              try {
                var method = ObjC.classes[className][selector];
                if (!method || !method.implementation) return;
                Interceptor.attach(method.implementation, callbacks);
                console.log('[+] Hooked ' + className + ' ' + selector);
              } catch (e) {
                console.log('[i] Cannot hook ' + className + ' ' + selector + ': ' + e);
              }
            }

            hookMethod('UIViewController', '- viewDidAppear:', {
              onEnter: function (args) {
                try {
                  var vc = new ObjC.Object(args[0]);
                  send({ type: 'screen_appeared', viewController: vc.$className });
                } catch (_) {}
              },
              onLeave: function (_) { dumpWindows('viewDidAppear'); }
            });

            hookMethod('UIControl', '- sendAction:to:forEvent:', {
              onEnter: function (args) {
                try {
                  var selector = ObjC.selectorAsString(args[2]);
                  var target = args[3].isNull() ? null : new ObjC.Object(args[3]);
                  var sender = args[4].isNull() ? null : new ObjC.Object(args[4]);
                  send({
                    type: 'control_action', selector: selector,
                    targetClass: target ? target.$className : '',
                    senderClass: sender ? sender.$className : '',
                    senderLabel: sender ? valueOf(sender, 'accessibilityLabel') : '',
                    senderIdentifier: sender ? valueOf(sender, 'accessibilityIdentifier') : '',
                    senderTitle: sender ? valueOf(sender, 'currentTitle') : ''
                  });
                } catch (e) { console.log('[i] Action decode failed: ' + e); }
              }
            });

            hookMethod('UINavigationController', '- pushViewController:animated:', {
              onEnter: function (args) {
                try {
                  var nextVC = new ObjC.Object(args[2]);
                  send({ type: 'navigation_push', viewController: nextVC.$className });
                } catch (_) {}
              }
            });

            hookMethod('UIViewController', '- presentViewController:animated:completion:', {
              onEnter: function (args) {
                try {
                  var nextVC = new ObjC.Object(args[2]);
                  send({ type: 'navigation_present', viewController: nextVC.$className });
                } catch (_) {}
              }
            });

            console.log('[*] Initial UI snapshot');
            dumpWindows('initial');
            console.log('[+] Runtime UI inspector ready. Interact with the app to collect events.');
          }
          JS

          cat > "$ANALYSIS_DIR/runtime_ui/README_RUNTIME_CAPTURE.md" <<'MD'
          # Runtime UI capture (manual device session)

          This GitHub workflow performs static analysis only. A GitHub-hosted macOS runner
          cannot automatically interact with your personal iPhone, so it cannot truthfully
          produce real page screenshots or a complete interaction flow by itself.

          `frida_ui_inspector.js` is generated for a separate, authorized runtime session.
          It reports:

          - visible UIKit view hierarchy, including class, frame, text and accessibility labels/identifiers;
          - ViewController appearance events;
          - UIControl action selector, target class and sender details;
          - UINavigationController push and UIViewController present transitions.

          Example usage on a computer that already has a compatible Frida setup and a test
          device/app process:

          ```bash
          frida -U -f YOUR_APP_BUNDLE_ID -l frida_ui_inspector.js
          ```

          Depending on iOS version, signing and device configuration, attaching to an app may
          require a permitted debug build, Frida Gadget, or an authorized test device setup.
          This workflow does not bypass code signing, FairPlay, jailbreak checks or app security.

          Save Frida's JSON messages to a log file, then organize them by `screen_appeared`,
          `ui_hierarchy`, `control_action`, `navigation_push` and `navigation_present` to build
          a verified page/interaction map. The script does not collect network traffic,
          domains, API endpoints, images, fonts, audio or video.
          MD

      - name: Generate final UI and feature report
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - "$ANALYSIS_DIR" "$APP_DIR" "$MACHO_BINARY_COUNT" <<'PY'
          import json, pathlib, sys
          root, app, macho_count = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), int(sys.argv[3])
          meta_file = root / 'metadata' / 'bundle_metadata.json'
          meta = json.loads(meta_file.read_text(encoding='utf-8')) if meta_file.exists() else {}
          ui_file = root / 'ui_analysis' / 'ui_static_map.json'
          ui = json.loads(ui_file.read_text(encoding='utf-8')) if ui_file.exists() else {}
          lines = [
              '# iOS App UI / Feature Reverse Analysis', '',
              '> 本报告区分静态证据与动态验证。静态候选不是已确认页面或已确认功能。', '',
              '## 1. App 基本信息',
              f'- App bundle: `{app.name}`',
              f'- Bundle count: {meta.get("bundle_count", 0)}',
              f'- Mach-O files analyzed: {macho_count}', '',
              '## 2. UI 入口与界面定义',
              '- 启动 Storyboard / NIB / Scene 配置：`metadata/bundle_metadata.json`、`ui_analysis/ui_entry_points.md`',
              '- 编译 Storyboard / NIB 清单：`ui_analysis/ui_files_manifest.csv`',
              '- NIB 对象信息（ibtool 可解析时）：`ui_analysis/interface_builder/`',
              '- 本地化界面文本：`ui_analysis/localized_text/`',
              '- UI 文件索引：`ui_analysis/localized_text_index.json`', '',
              '## 3. 页面与组件候选',
              f'- UI 文件/目录数：{ui.get("ui_definition_file_count", 0)}',
              f'- 类/类型候选：{ui.get("objc_or_swift_type_candidates", 0)}',
              f'- 交互方法候选：{ui.get("interaction_method_candidates", 0)}',
              f'- 导航 API 候选：{ui.get("navigation_api_candidates", 0)}',
              '- 详细清单：`ui_analysis/ui_static_map.md`、`feature_map.csv`', '',
              '## 4. 交互与页面跳转线索',
              '- 按钮/控件方法名候选：`ui_analysis/interaction_candidates.csv`',
              '- 导航 API 出现位置：`ui_analysis/navigation_candidates.csv`',
              '- 这些只是静态符号线索；需要动态操作才能确认真实跳转条件与结果。', '',
              '## 5. 代码实现线索',
              '- Objective-C 类和头文件：`objc/`',
              '- Swift 类型、协议和 demangle 信息：`swift/`',
              '- Mach-O 函数、符号、导入导出及指令：`macho/`',
              '- 功能映射索引：`feature_map.csv`', '',
              '## 6. 动态 UI 检查',
              '- Frida 检查脚本：`runtime_ui/frida_ui_inspector.js`',
              '- 使用说明：`runtime_ui/README_RUNTIME_CAPTURE.md`',
              '- GitHub 托管 Runner 不会自动连接个人 iPhone，因此本次静态工作流不会生成真实运行截图。', '',
              '## 7. 本工作流明确不收集的内容',
              '- 不复制或提取图片、字体、音频、视频及 Assets.car rendition。',
              '- 不提取域名、URL、API 路径、请求参数或网络流量。',
              '- 不上传原始 IPA 或原始 Mach-O 二进制。', '',
              '## 8. 分析限制',
              '- SwiftUI/UIKit 动态创建的界面，无法保证仅凭 IPA 静态还原完整 View 层级。',
              '- 符号剥离、混淆、优化、加密和运行时生成代码会减少可识别的类与方法。',
              '- 不能从 IPA 完整恢复原始源码、注释、变量名或服务端实现。',
              '- 按钮真实行为、页面状态和功能调用顺序，需要在可运行的授权设备/模拟环境中动态验证。', '',
          ]
          (root / 'ULTIMATE_REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          {
            echo '## UI / Feature reverse analysis completed'
            echo "- App: \`$(basename "$APP_DIR")\`"
            echo "- Mach-O files analyzed: **$MACHO_BINARY_COUNT**"
            echo '- Main report: `ULTIMATE_REPORT.md`'
            echo '- UI map: `ui_analysis/ui_static_map.md`'
            echo '- Feature index: `feature_map.csv`'
            echo '- Runtime inspector: `runtime_ui/frida_ui_inspector.js`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI and feature analysis
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ui-feature-analysis
          path: .ipa-reverse-work/analysis/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
